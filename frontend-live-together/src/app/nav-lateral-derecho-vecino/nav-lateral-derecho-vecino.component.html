@if(!(lateralActivo === 'chat')) {
  <app-header-vecino
    (notificacionesClicked)="mostrarNotificaciones()"
    (chatClicked)="mostrarListaVecinos()">
  </app-header-vecino>
}


<ion-col size="12" size-md="2.5" class="menu-lateral">
  @if (lateralActivo === 'vecinos') {
    <ng-container>
      <app-lista-vecinos
        (abrirChatDesktop)="abrirChat($event)">
      </app-lista-vecinos>
    </ng-container>
  }

  @if (lateralActivo === 'chat' && vecinoSeleccionado) {
    <ng-container>
      <app-chat
        [vecinoInput]="vecinoSeleccionado"
        (cerrar)="cerrarChat()">
      </app-chat>
    </ng-container>
  }

  @if (lateralActivo === 'notificaciones') {
    <ng-container>
      <app-notificaciones></app-notificaciones>
    </ng-container>
  }
</ion-col>
